<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Oficina Guilherme Gaijutis</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica Guilherme Gaijutis</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="servicos.html">Serviços</a></li>
            <li><a href="agendar.html">Agendar</a></li>
        </ul>
    </nav>

    <main>
        <h2>Agende sua Manutenção</h2>
        <form action="#" method="post">
            <p>
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="servico">Serviço Desejado:</label><br>
                <select id="servico" name="servico" required>
                    <option value="">Selecione um serviço...</option>
                    <option value="oleo">Troca de Óleo</option>
                    <option value="freio">Revisão de Freios</option>
                    <option value="alinhamento">Alinhamento / Balanceamento</option>
                    <option value="injecao">Injeção Eletrônica</option>
                </select>
            </p>

            <p>
                <label for="data">Data de Preferência:</label><br>
                <input type="date" id="data" name="data" required>
            </p>

            <p>
                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" required inputmode="numeric" maxlength="15" pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}" title="Formato de telefone inválido. Exemplo: 17 98765-4321 ou 17987654321">
            </p>

            <p>
                <label for="email">E-mail de Contato:</label><br>
                <input type="email" id="email" name="email">
            </p>

            <p>
                <button type="submit">Solicitar Agendamento</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Oficina Mecânica Guilherme Gaijutis - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
